    <main>
        <h1> Pure HTML Form </h1>

        <div>
            <form action="https://httpbin.org/post" method="POST" class="flex-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="user" autocomplete="name" minlength="1" maxlength="100" placeholder="Enter your full name here..." required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="user_email" autocomplete="email" placeholder="Enter your well-formatted email (including an '@') here..." required>
                </div>

                <div class="form-group">
                    <label for="user_comment">Leave us a comment:</label>
                    <textarea id="user_comment" name="comment" rows="4" cols="50" placeholder="Comments go here..." 
                    minlength="10" maxlength="1000" required></textarea>
                </div>    
                    <input type="hidden" id="bot" name="possible_bot" value="true">

                    <button type="submit">Submit</button>
            </form>
        </div>
    </main>
  </div>
</body>
